name: Install Tested Voice
on:
  push:
    paths:
      - .github/workflows/integrate-letter-voice.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden login connection
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='const res=await jsonpRequest({api:"login",loginId:id,passwordHash:passwordHash});'
          new='''let res;\n    try{\n      res=await jsonpRequest({api:"login",loginId:id,passwordHash:passwordHash,_t:Date.now()});\n    }catch(firstErr){\n      await new Promise(r=>setTimeout(r,700));\n      res=await jsonpRequest({api:"login",loginId:id,passwordHash:passwordHash,_t:Date.now(),retry:1});\n    }'''
          if old not in s:
              raise SystemExit('Login request line not found')
          s=s.replace(old,new,1)
          # Extend JSONP timeout only if the current implementation uses the previous short timeout.
          s=s.replace('setTimeout(()=>{cleanup();reject(new Error("timeout"));},10000)',
                      'setTimeout(()=>{cleanup();reject(new Error("timeout"));},25000)')
          s=s.replace('setTimeout(function(){cleanup();reject(new Error("timeout"));},10000)',
                      'setTimeout(function(){cleanup();reject(new Error("timeout"));},25000)')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit login fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Improve Apps Script login reliability"
          git push
