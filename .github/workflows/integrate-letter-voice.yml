name: Install Voice UI Fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/integrate-letter-voice.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visible Clear button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          needle='<button type="button" id="micBtn" class="primary" onclick="startVoiceSpelling()" style="font-size:18px;padding:14px 24px">🎤 START SPELLING</button>'
          button='<button type="button" id="voiceClearMainBtn" class="secondary" onclick="clearVoiceSpelling()" style="font-size:18px;padding:14px 24px;margin-left:8px">🧽 CLEAR</button>'
          if 'id="voiceClearMainBtn"' not in s:
              if needle not in s: raise SystemExit('mic button not found')
              s=s.replace(needle,needle+'\n  '+button,1)
          p.write_text(s,encoding='utf-8')
          assert 'id="voiceClearMainBtn"' in s
          assert "st.textContent='Listening… spell '+target().split('').join(' – ');" not in s
          assert "t.toUpperCase()===target())out.push(...t.toUpperCase())" not in s
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Show Clear button in formal Voice spelling'
          git push
