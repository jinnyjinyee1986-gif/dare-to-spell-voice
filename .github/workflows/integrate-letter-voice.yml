name: Install Tested Voice
on:
  push:
    paths:
      - .github/workflows/integrate-letter-voice.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Voice answer leak
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Never show target letters while the microphone is listening.
          s=s.replace("st.textContent='Listening… spell '+target().split('').join(' – ');",
                      "st.textContent='🎤 Listening… Spell the word aloud, one letter at a time.';")

          # Never convert the pronunciation of the whole target word into letters.
          s=s.replace("else if(/^[a-z]{2,30}$/.test(t)&&t.toUpperCase()===target())out.push(...t.toUpperCase())","")

          # Same protection in the older parser/fallback path.
          old='''  // If recognizer actually returned a compact letter sequence, accept it only
  // when every character is alphabetic and length is plausible.
  if(!out){
    var compact=raw.replace(/[^a-z]/g,"");
    if(compact.length>1 && compact.length<=24 && /^[a-z]+$/.test(compact)){
      // Do not treat ordinary recognized words as spelling unless it exactly
      // matches the current target; this prevents random sentence words.
      if(normalize(compact)===normalize(current)) out=compact.toUpperCase();
    }
  }
'''
          if old in s:
              s=s.replace(old,'')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit Voice privacy fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove Voice answer hint and whole-word shortcut"
          git push
