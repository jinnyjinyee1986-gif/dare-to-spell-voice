name: Integrate tested letter voice recognition
on:
  push:
    paths:
      - '.github/workflows/integrate-letter-voice.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html with tested recognizer
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove the previous broken injected patch if present.
          s=re.sub(r'\s*<script id="DTS_TESTED_LETTER_VOICE_V1">.*?</script>\s*', '\n', s, flags=re.S)
          js=r'''
          <script id="DTS_TESTED_LETTER_VOICE_V2">
          // Same recognition strategy as the successful letter-test.html page.
          // This script only overrides Voice Spelling; Typing mode is untouched.
          (function(){
            const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
            const aliases={a:'A',ay:'A',b:'B',be:'B',bee:'B',c:'C',see:'C',sea:'C',d:'D',dee:'D',e:'E',ee:'E',f:'F',ef:'F',g:'G',gee:'G',h:'H',aitch:'H',i:'I',eye:'I',j:'J',jay:'J',k:'K',kay:'K',l:'L',el:'L',m:'M',em:'M',n:'N',en:'N',o:'O',oh:'O',p:'P',pea:'P',pee:'P',q:'Q',cue:'Q',queue:'Q',r:'R',are:'R',s:'S',ess:'S',t:'T',tea:'T',tee:'T',u:'U',you:'U',v:'V',vee:'V',w:'W','double u':'W','double you':'W',x:'X',ex:'X',y:'Y',why:'Y',z:'Z',zed:'Z',zee:'Z'};
            let rec=null,running=false;
            function target(){return String(current||'').toUpperCase().replace(/[^A-Z]/g,'');}
            function normText(s){return String(s||'').toLowerCase().replace(/[.,!?;:]/g,' ').replace(/\s+/g,' ').trim();}
            function decode(s){s=normText(s);if(!s)return[];let toks=s.split(' '),out=[];for(let i=0;i<toks.length;i++){let two=toks.slice(i,i+2).join(' ');if(aliases[two]){out.push(aliases[two]);i++;continue}let t=toks[i];if(aliases[t])out.push(aliases[t]);else if(t.length===1&&/[a-z]/.test(t))out.push(t.toUpperCase());else if(/^[a-z]{2,30}$/.test(t)&&t.toUpperCase()===target())out.push(...t.toUpperCase())}return out;}
            function distance(a,b){let m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
            function choose(alts){let t=target(),best=null;alts.forEach((text,idx)=>{let l=decode(text),str=l.join('');if(!l.length)return;let score=distance(str,t)*10+Math.abs(str.length-t.length)*3+idx*.1;if(!best||score<best.score)best={letters:l,text,score};});return best;}
            window.stopVoiceRecognition=function(){try{if(rec)rec.abort();}catch(e){}rec=null;running=false;};
            window.startVoiceSpelling=function(){
              if(practiceMode!=='VOICE'||correctionMode)return;
              const st=document.getElementById('voiceStatus'),btn=document.getElementById('micBtn'),heard=document.getElementById('heardLetters');
              if(!SR){st.textContent='This browser does not support free SpeechRecognition. Try current Chrome on Android/Windows.';return;}
              try{speechSynthesis.cancel();}catch(e){}
              try{if(rec)rec.abort();}catch(e){}
              heard.textContent='';
              rec=new SR();rec.lang='en-GB';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=10;running=true;
              btn.disabled=true;btn.textContent='🔴 LISTENING…';st.textContent='Listening… spell '+target().split('').join(' – ');
              let handled=false;
              rec.onresult=function(e){
                for(let i=e.resultIndex;i<e.results.length;i++){
                  let rr=e.results[i],alts=[];for(let j=0;j<rr.length;j++)alts.push(rr[j].transcript);
                  let best=choose(alts);if(!best)continue;
                  heard.textContent=best.letters.join(' ');
                  let str=best.letters.join(''),t=target();
                  if(str===t){st.textContent='I HEARD: '+best.letters.join(' ');if(!handled){handled=true;try{rec.stop();}catch(x){}setTimeout(()=>checkVoiceAnswer(str),180);}return;}
                  if(str.length<t.length){st.textContent='I heard '+best.letters.join(' ')+' — keep spelling / try the whole word again. No wrong attempt counted.';}
                  else if(rr.isFinal){st.textContent='I HEARD: '+best.letters.join(' ');if(!handled){handled=true;try{rec.stop();}catch(x){}setTimeout(()=>checkVoiceAnswer(str),180);}return;}
                }
              };
              rec.onerror=function(e){if(e.error==='no-speech')st.textContent='No clear spelling was heard. Try again. No wrong attempt counted.';else if(e.error==='not-allowed'||e.error==='service-not-allowed')st.textContent='Microphone permission was denied.';else st.textContent='Recognition error: '+e.error+'. Try again. No wrong attempt counted.';};
              rec.onend=function(){running=false;rec=null;btn.disabled=false;btn.textContent='🎤 START SPELLING';};
              try{rec.start();}catch(e){running=false;btn.disabled=false;btn.textContent='🎤 START SPELLING';st.textContent='Could not start microphone: '+e.message;}
            };
          })();
          </script>
          '''
          if '</body>' not in s: raise SystemExit('Could not find </body>')
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patched student app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix formal Voice Spelling recognizer"
          git push
