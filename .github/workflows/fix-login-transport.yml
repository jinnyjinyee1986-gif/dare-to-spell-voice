name: Fix Login Transport

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-login-transport.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make login transport more reliable
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='''function jsonpRequest(params,timeoutMs=12000){
  return new Promise((resolve,reject)=>{
    const cb="dts_cb_"+Date.now()+"_"+Math.floor(Math.random()*1000000);
    const sc=document.createElement("script");
    const timer=setTimeout(()=>cleanup(new Error("timeout")),timeoutMs);
    function cleanup(err,data){clearTimeout(timer);try{delete window[cb]}catch(e){};if(sc.parentNode)sc.remove();err?reject(err):resolve(data);}
    window[cb]=data=>cleanup(null,data);
    sc.onerror=()=>cleanup(new Error("network"));
    params.callback=cb; params._=Date.now();
    sc.src=APPS_SCRIPT_URL+"?"+new URLSearchParams(params).toString();
    document.body.appendChild(sc);
  });
}'''
          new='''function jsonpRequest(params,timeoutMs=30000){
  return new Promise((resolve,reject)=>{
    const cb="dts_cb_"+Date.now()+"_"+Math.floor(Math.random()*1000000);
    const sc=document.createElement("script");
    let done=false;
    const timer=setTimeout(()=>cleanup(new Error("timeout")),timeoutMs);
    function cleanup(err,data){
      if(done)return; done=true;
      clearTimeout(timer);
      try{delete window[cb]}catch(e){}
      if(sc.parentNode)sc.remove();
      err?reject(err):resolve(data);
    }
    window[cb]=data=>cleanup(null,data);
    sc.async=true;
    sc.referrerPolicy="no-referrer";
    sc.onerror=()=>cleanup(new Error("network"));
    const q=Object.assign({},params,{callback:cb,_:Date.now()});
    sc.src=APPS_SCRIPT_URL+"?"+new URLSearchParams(q).toString();
    (document.head||document.documentElement).appendChild(sc);
  });
}'''
          if old not in s:
              raise SystemExit("jsonpRequest marker not found")
          s=s.replace(old,new,1)

          old2='''    let res;
    try{
      res=await jsonpRequest({api:"login",loginId:id,passwordHash:passwordHash,_t:Date.now()});
    }catch(firstErr){
      await new Promise(r=>setTimeout(r,700));
      res=await jsonpRequest({api:"login",loginId:id,passwordHash:passwordHash,_t:Date.now(),retry:1});
    }'''
          new2='''    let res;
    try{
      res=await jsonpRequest({api:"login",loginId:id,passwordHash:passwordHash},30000);
    }catch(firstErr){
      fb.textContent="Connecting… retrying once.";
      await new Promise(r=>setTimeout(r,1200));
      res=await jsonpRequest({api:"login",loginId:id,passwordHash:passwordHash,retry:1},30000);
    }'''
          if old2 not in s:
              raise SystemExit("login retry marker not found")
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit login transport fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make Apps Script login connection more reliable"
          git push
